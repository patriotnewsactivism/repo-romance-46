name: Repair canonical portfolio domain

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/repair-canonical-domain.yml"
      - "artifacts/api-server/src/lib/config.ts"
  workflow_run:
    workflows:
      - "Deploy Cloud Run"
    types:
      - completed

permissions:
  contents: read
  id-token: write

concurrency:
  group: repofinisher-canonical-domain-repair
  cancel-in-progress: true

env:
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'repofinish' }}
  WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || 'projects/537202246054/locations/global/workloadIdentityPools/github-actions/providers/repofinisher' }}
  DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT || 'repofinisher-deployer@repofinish.iam.gserviceaccount.com' }}
  WEB_SERVICE: repofinisher-web
  API_SERVICE: repofinisher-api
  API_PUBLIC_URL: https://repofinisher-api-z6kubh2jtq-uc.a.run.app
  CUSTOM_DOMAIN: portfolio.donmatthews.live
  CUSTOM_DOMAIN_URL: https://portfolio.donmatthews.live
  BASE_DOMAIN: donmatthews.live

jobs:
  repair:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify or repair Cloud Run domain mapping
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          access_token="$(gcloud auth print-access-token)"
          api_base="https://${REGION}-run.googleapis.com/apis/domains.cloudrun.com/v1/namespaces/${PROJECT_ID}/domainmappings"
          mapping_url="${api_base}/${CUSTOM_DOMAIN}"
          auth_header="Authorization: Bearer ${access_token}"

          get_mapping() {
            curl --silent --show-error -H "${auth_header}" -H 'Content-Type: application/json' \
              -o /tmp/portfolio-domain.json -w '%{http_code}' "${mapping_url}"
          }

          mapping_status="$(get_mapping)"
          if [[ "${mapping_status}" == "200" ]]; then
            mapped_service="$(jq -r '.spec.routeName // ""' /tmp/portfolio-domain.json)"
            if [[ "${mapped_service}" != "${WEB_SERVICE}" ]]; then
              curl --fail --silent --show-error -X DELETE -H "${auth_header}" "${mapping_url}" >/dev/null
              mapping_status="404"
            fi
          elif [[ "${mapping_status}" != "404" ]]; then
            cat /tmp/portfolio-domain.json >&2
            echo "Unable to inspect ${CUSTOM_DOMAIN} mapping (HTTP ${mapping_status})." >&2
            exit 1
          fi

          if [[ "${mapping_status}" == "404" ]]; then
            payload="$(jq -cn \
              --arg domain "${CUSTOM_DOMAIN}" \
              --arg project "${PROJECT_ID}" \
              --arg region "${REGION}" \
              --arg service "${WEB_SERVICE}" \
              '{apiVersion:"domains.cloudrun.com/v1",kind:"DomainMapping",metadata:{name:$domain,namespace:$project,annotations:{"run.googleapis.com/region":$region}},spec:{routeName:$service,certificateMode:"AUTOMATIC",forceOverride:true}}')"
            curl --fail --silent --show-error -X POST -H "${auth_header}" -H 'Content-Type: application/json' \
              --data "${payload}" "${api_base}" >/tmp/portfolio-domain.json
          fi

          record_types=()
          record_values=()
          for attempt in 1 2 3 4 5 6; do
            mapping_status="$(get_mapping)"
            [[ "${mapping_status}" == "200" ]] || { sleep $((attempt * 5)); continue; }
            mapfile -t record_types < <(jq -r '.status.resourceRecords[]?.type' /tmp/portfolio-domain.json)
            mapfile -t record_values < <(jq -r '.status.resourceRecords[]?.rrdata' /tmp/portfolio-domain.json)
            [[ ${#record_types[@]} -gt 0 ]] && break
            sleep $((attempt * 5))
          done
          [[ ${#record_types[@]} -gt 0 ]] || { echo "Domain mapping did not emit DNS records." >&2; exit 1; }

          [[ -n "${CLOUDFLARE_API_TOKEN}" ]] || { echo "CLOUDFLARE_API_TOKEN is required." >&2; exit 1; }
          zone_id="${CLOUDFLARE_ZONE_ID}"
          if [[ -z "${zone_id}" ]]; then
            zone_response="$(curl --fail --silent --show-error -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/zones?name=${BASE_DOMAIN}&status=active")"
            zone_id="$(jq -r '.result[0].id // ""' <<<"${zone_response}")"
          fi
          [[ -n "${zone_id}" ]] || { echo "Cloudflare zone could not be resolved." >&2; exit 1; }

          existing="$(curl --fail --silent --show-error -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records?name=${CUSTOM_DOMAIN}&per_page=100")"
          mapfile -t existing_ids < <(jq -r '.result[]?.id' <<<"${existing}")
          for record_id in "${existing_ids[@]}"; do
            curl --fail --silent --show-error -X DELETE -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records/${record_id}" >/dev/null
          done

          for i in "${!record_types[@]}"; do
            payload="$(jq -cn --arg type "${record_types[$i]}" --arg name "${CUSTOM_DOMAIN}" --arg content "${record_values[$i]%\.}" '{type:$type,name:$name,content:$content,ttl:1,proxied:false}')"
            response="$(curl --fail --silent --show-error -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' --data "${payload}" "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records")"
            [[ "$(jq -r '.success' <<<"${response}")" == "true" ]] || { jq -c '.errors' <<<"${response}" >&2; exit 1; }
          done

          echo "Cloud Run mapping and Cloudflare DNS are aligned for ${CUSTOM_DOMAIN}."

      - name: Set API CORS to the real canonical frontend
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services update "${API_SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --update-env-vars="CORS_ALLOWED_ORIGINS=${CUSTOM_DOMAIN_URL}" \
            --quiet

      - name: Verify canonical frontend and API CORS
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl --fail --silent --show-error --max-time 15 "${CUSTOM_DOMAIN_URL}/" | grep -q 'repofinisher-api-platform.*google-cloud-run-production'; then
              break
            fi
            [[ "${attempt}" == "8" ]] && { echo "Canonical frontend verification failed." >&2; exit 1; }
            sleep $((attempt * 8))
          done

          headers="$(mktemp)"
          curl --fail --silent --show-error -D "${headers}" -o /dev/null \
            -H "Origin: ${CUSTOM_DOMAIN_URL}" \
            "${API_PUBLIC_URL}/api/healthz"
          grep -Eqi "^access-control-allow-origin: ${CUSTOM_DOMAIN_URL//./\.}\r?$" "${headers}" || {
            cat "${headers}" >&2
            echo "API CORS does not allow ${CUSTOM_DOMAIN_URL}." >&2
            exit 1
          }

          echo "Verified ${CUSTOM_DOMAIN_URL} -> ${WEB_SERVICE} and API CORS."
