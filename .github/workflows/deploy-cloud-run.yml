name: Deploy Cloud Run

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "artifacts/api-server/**"
      - "artifacts/repo-finisher/**"
      - "lib/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "Dockerfile.apiserver"
      - "Dockerfile.frontend"
      - "netlify.toml"
      - ".github/workflows/deploy-cloud-run.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: repofinisher-cloud-run-production
  cancel-in-progress: false

env:
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'repofinish' }}
  WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || 'projects/537202246054/locations/global/workloadIdentityPools/github-actions/providers/repofinisher' }}
  DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT || 'repofinisher-deployer@repofinish.iam.gserviceaccount.com' }}
  RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT || 'repofinisher-runtime@repofinish.iam.gserviceaccount.com' }}
  ARTIFACT_REPOSITORY: repofinisher
  IMAGE_NAME: repofinisher-api
  WEB_IMAGE_NAME: repofinisher-web
  API_SERVICE: repofinisher-api
  WEB_SERVICE: repofinisher-web
  COMPLETION_JOB: repofinisher-completion-session
  API_PUBLIC_URL: https://repofinisher-api-z6kubh2jtq-uc.a.run.app
  WEB_PUBLIC_URL: https://repofinisher-web-z6kubh2jtq-uc.a.run.app
  CUSTOM_DOMAIN: repofinisher.donmatthews.live
  CUSTOM_DOMAIN_URL: https://repofinisher.donmatthews.live
  BASE_DOMAIN: donmatthews.live
  SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://rdsrxfzahhxbvugyarld.supabase.co' }}
  SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || 'sb_publishable_95xMusG9KjCGJemIa8dgcw_-8JqzgER' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify required production Secret Manager values exist
        shell: bash
        run: |
          set -euo pipefail
          required=(
            repofinisher-supabase-backend-key
            repofinisher-secret-encryption-key
            repofinisher-plan-signing-secret
          )
          for secret_name in "${required[@]}"; do
            gcloud secrets describe "${secret_name}" --project="${PROJECT_ID}" >/dev/null
            enabled_version="$(gcloud secrets versions list "${secret_name}" \
              --project="${PROJECT_ID}" \
              --filter='state=ENABLED' \
              --format='value(name)' \
              --limit=1)"
            if [[ -z "${enabled_version}" ]]; then
              echo "Required secret ${secret_name} has no enabled version." >&2
              exit 1
            fi
            echo "Verified ${secret_name} has an enabled version."
          done

      - name: Configure Artifact Registry authentication
        shell: bash
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push immutable API image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          docker build --file Dockerfile.apiserver --tag "${IMAGE}" .
          docker push "${IMAGE}"

      - name: Build and push immutable frontend image
        shell: bash
        run: |
          set -euo pipefail
          WEB_IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${WEB_IMAGE_NAME}:${GITHUB_SHA}"
          echo "WEB_IMAGE=${WEB_IMAGE}" >> "$GITHUB_ENV"
          docker build \
            --file Dockerfile.frontend \
            --build-arg "VITE_API_BASE_URL=${API_PUBLIC_URL}" \
            --build-arg "VITE_SUPABASE_URL=${SUPABASE_URL}" \
            --build-arg "VITE_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}" \
            --tag "${WEB_IMAGE}" \
            .
          docker push "${WEB_IMAGE}"

      - name: Deploy completion-session worker job
        id: deploy_job
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          region: ${{ env.REGION }}
          job: ${{ env.COMPLETION_JOB }}
          image: ${{ env.IMAGE }}
          env_vars: |-
            NODE_ENV=production
            SUPABASE_URL=${{ env.SUPABASE_URL }}
            SUPABASE_ANON_KEY=${{ env.SUPABASE_ANON_KEY }}
            LOG_LEVEL=info
            NODE_OPTIONS=--enable-source-maps
            AI_PROVIDER=openrouter
            OPENROUTER_MODEL=deepseek/deepseek-v4-flash-0731
            CLOUD_RUN_JOBS_ENABLED=false
            SENTRY_ENVIRONMENT=production
            SENTRY_RELEASE=${{ github.sha }}
            SENTRY_TRACES_SAMPLE_RATE=0.05
          secrets: |-
            SUPABASE_SECRET_KEY=repofinisher-supabase-backend-key:latest
            SECRET_ENCRYPTION_KEY=repofinisher-secret-encryption-key:latest
            PLAN_SIGNING_SECRET=repofinisher-plan-signing-secret:latest
          flags: >-
            --service-account=${{ env.RUNTIME_SERVICE_ACCOUNT }}
            --cpu=2
            --memory=2Gi
            --max-retries=1
            --task-timeout=30m
            --command=node
            --args=./dist/completion-session-job.mjs

      - name: Allow API runtime to execute worker job with per-run overrides
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs add-iam-policy-binding "${COMPLETION_JOB}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --member="serviceAccount:${RUNTIME_SERVICE_ACCOUNT}" \
            --role="roles/run.developer" \
            --quiet

      - name: Deploy API control plane
        id: deploy_api
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          region: ${{ env.REGION }}
          service: ${{ env.API_SERVICE }}
          image: ${{ env.IMAGE }}
          timeout: 300s
          env_vars: |-
            NODE_ENV=production
            SUPABASE_URL=${{ env.SUPABASE_URL }}
            SUPABASE_ANON_KEY=${{ env.SUPABASE_ANON_KEY }}
            CORS_ALLOWED_ORIGINS=${{ env.CUSTOM_DOMAIN_URL }},${{ env.WEB_PUBLIC_URL }}
            LOG_LEVEL=info
            NODE_OPTIONS=--enable-source-maps
            AI_PROVIDER=openrouter
            OPENROUTER_MODEL=deepseek/deepseek-v4-flash-0731
            CLOUD_RUN_JOBS_ENABLED=true
            GCP_PROJECT_ID=${{ env.PROJECT_ID }}
            GCP_REGION=${{ env.REGION }}
            COMPLETION_SESSION_JOB=${{ env.COMPLETION_JOB }}
            SENTRY_ENVIRONMENT=production
            SENTRY_RELEASE=${{ github.sha }}
            SENTRY_TRACES_SAMPLE_RATE=0.05
          secrets: |-
            SUPABASE_SECRET_KEY=repofinisher-supabase-backend-key:latest
            SECRET_ENCRYPTION_KEY=repofinisher-secret-encryption-key:latest
            PLAN_SIGNING_SECRET=repofinisher-plan-signing-secret:latest
          flags: >-
            --service-account=${{ env.RUNTIME_SERVICE_ACCOUNT }}
            --cpu=1
            --memory=1Gi
            --min-instances=0
            --max-instances=5
            --concurrency=20
            --allow-unauthenticated

      - name: Verify Cloud Run API directly
        shell: bash
        env:
          API_URL: ${{ steps.deploy_api.outputs.url }}
        run: |
          set -euo pipefail
          echo "Cloud Run API: ${API_URL}"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error "${API_URL}/api/healthz" >/dev/null; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "Cloud Run API health check failed." >&2
          exit 1

      - name: Deploy frontend
        id: deploy_web
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          region: ${{ env.REGION }}
          service: ${{ env.WEB_SERVICE }}
          image: ${{ env.WEB_IMAGE }}
          timeout: 300s
          flags: >-
            --service-account=${{ env.RUNTIME_SERVICE_ACCOUNT }}
            --cpu=1
            --memory=512Mi
            --min-instances=0
            --max-instances=3
            --concurrency=80
            --allow-unauthenticated

      - name: Verify Cloud Run frontend directly
        shell: bash
        env:
          WEB_URL: ${{ steps.deploy_web.outputs.url }}
        run: |
          set -euo pipefail
          echo "Cloud Run frontend: ${WEB_URL}"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error "${WEB_URL}/" | grep -q 'repofinisher-api-platform.*google-cloud-run-production'; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "Cloud Run frontend verification failed." >&2
          exit 1

      - name: Audit deployed environment contract
        shell: bash
        run: |
          set -euo pipefail

          api_json="$(mktemp)"
          job_json="$(mktemp)"
          gcloud run services describe "${API_SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format=json > "${api_json}"
          gcloud run jobs describe "${COMPLETION_JOB}" --project="${PROJECT_ID}" --region="${REGION}" --format=json > "${job_json}"

          api_required=(
            NODE_ENV SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SECRET_KEY
            SECRET_ENCRYPTION_KEY PLAN_SIGNING_SECRET CORS_ALLOWED_ORIGINS LOG_LEVEL
            AI_PROVIDER OPENROUTER_MODEL CLOUD_RUN_JOBS_ENABLED GCP_PROJECT_ID GCP_REGION
            COMPLETION_SESSION_JOB SENTRY_ENVIRONMENT SENTRY_RELEASE SENTRY_TRACES_SAMPLE_RATE
          )
          job_required=(
            NODE_ENV SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SECRET_KEY
            SECRET_ENCRYPTION_KEY PLAN_SIGNING_SECRET LOG_LEVEL AI_PROVIDER OPENROUTER_MODEL
            CLOUD_RUN_JOBS_ENABLED SENTRY_ENVIRONMENT SENTRY_RELEASE SENTRY_TRACES_SAMPLE_RATE
          )

          api_names="$(jq -r '.spec.template.spec.containers[0].env[]?.name' "${api_json}")"
          job_names="$(jq -r '.spec.template.template.spec.template.spec.containers[0].env[]?.name // empty' "${job_json}" 2>/dev/null || true)"
          if [[ -z "${job_names}" ]]; then
            job_names="$(jq -r '.. | objects | select(has("env")) | .env[]?.name // empty' "${job_json}")"
          fi

          for name in "${api_required[@]}"; do
            if ! grep -Fxq "${name}" <<<"${api_names}"; then
              echo "Cloud Run API is missing required environment variable ${name}." >&2
              exit 1
            fi
          done
          for name in "${job_required[@]}"; do
            if ! grep -Fxq "${name}" <<<"${job_names}"; then
              echo "Cloud Run worker job is missing required environment variable ${name}." >&2
              exit 1
            fi
          done
          echo "Verified all required API and worker environment-variable names are present."

      - name: Ensure custom domain mapping and update Cloudflare DNS when credentials are available
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail

          if gcloud beta run domain-mappings describe \
            --domain="${CUSTOM_DOMAIN}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format=json >/tmp/repofinisher-domain.json 2>/dev/null; then
            mapped_service="$(jq -r '.spec.routeName // ""' /tmp/repofinisher-domain.json)"
            if [[ "${mapped_service}" != "${WEB_SERVICE}" ]]; then
              gcloud beta run domain-mappings create \
                --service="${WEB_SERVICE}" \
                --domain="${CUSTOM_DOMAIN}" \
                --project="${PROJECT_ID}" \
                --region="${REGION}" \
                --force-override \
                --quiet
            fi
          else
            gcloud beta run domain-mappings create \
              --service="${WEB_SERVICE}" \
              --domain="${CUSTOM_DOMAIN}" \
              --project="${PROJECT_ID}" \
              --region="${REGION}" \
              --quiet
          fi

          gcloud beta run domain-mappings describe \
            --domain="${CUSTOM_DOMAIN}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format=json >/tmp/repofinisher-domain.json

          mapfile -t record_types < <(jq -r '.status.resourceRecords[]?.type' /tmp/repofinisher-domain.json)
          mapfile -t record_values < <(jq -r '.status.resourceRecords[]?.rrdata' /tmp/repofinisher-domain.json)

          if [[ ${#record_types[@]} -eq 0 ]]; then
            echo "Cloud Run domain mapping exists but has not emitted DNS resource records yet." >&2
            exit 1
          fi

          {
            echo "### Custom-domain mapping"
            echo
            echo "Cloud Run service: \`${WEB_SERVICE}\`"
            echo "Domain: \`${CUSTOM_DOMAIN}\`"
            echo
            echo "Required DNS records:"
            for i in "${!record_types[@]}"; do
              echo "- \`${record_types[$i]} ${CUSTOM_DOMAIN} -> ${record_values[$i]}\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "CLOUDFLARE_API_TOKEN is not configured in GitHub; Cloud Run mapping is created, but external Cloudflare DNS cannot be changed automatically." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          zone_id="${CLOUDFLARE_ZONE_ID}"
          if [[ -z "${zone_id}" ]]; then
            zone_response="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              "https://api.cloudflare.com/client/v4/zones?name=${BASE_DOMAIN}&status=active")"
            zone_id="$(jq -r '.result[0].id // ""' <<<"${zone_response}")"
          fi
          if [[ -z "${zone_id}" ]]; then
            echo "Cloudflare token is present but the ${BASE_DOMAIN} zone could not be resolved." >&2
            exit 1
          fi

          existing="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records?name=${CUSTOM_DOMAIN}&per_page=100")"
          mapfile -t existing_ids < <(jq -r '.result[]?.id' <<<"${existing}")
          for record_id in "${existing_ids[@]}"; do
            curl --fail --silent --show-error -X DELETE \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records/${record_id}" >/dev/null
          done

          for i in "${!record_types[@]}"; do
            record_type="${record_types[$i]}"
            record_value="${record_values[$i]%\.}"
            payload="$(jq -cn \
              --arg type "${record_type}" \
              --arg name "${CUSTOM_DOMAIN}" \
              --arg content "${record_value}" \
              '{type:$type,name:$name,content:$content,ttl:1,proxied:false}')"
            response="$(curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data "${payload}" \
              "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records")"
            if [[ "$(jq -r '.success' <<<"${response}")" != "true" ]]; then
              echo "Cloudflare rejected the ${record_type} record update." >&2
              jq -c '.errors' <<<"${response}" >&2
              exit 1
            fi
          done
          echo "Cloudflare DNS updated in DNS-only mode for Google-managed certificate provisioning." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish deployment summary
        shell: bash
        env:
          API_URL: ${{ steps.deploy_api.outputs.url }}
          WEB_URL: ${{ steps.deploy_web.outputs.url }}
        run: |
          {
            echo "## RepoFinisher Cloud Run deployment"
            echo
            echo "- Canonical frontend: ${CUSTOM_DOMAIN_URL}"
            echo "- Direct frontend: ${WEB_URL}"
            echo "- API: ${API_URL}"
            echo "- Worker job: ${COMPLETION_JOB}"
            echo "- Image: ${IMAGE}"
            echo "- Frontend image: ${WEB_IMAGE}"
            echo "- Region: ${REGION}"
          } >> "$GITHUB_STEP_SUMMARY"
