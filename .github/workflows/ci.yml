name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce non-Vercel hosting policy
        shell: bash
        run: |
          set -euo pipefail
          forbidden=(
            "vercel.json"
            "api/[...path].mjs"
            "artifacts/api-server/build-vercel.mjs"
            "artifacts/api-server/src/vercel.ts"
          )
          for path in "${forbidden[@]}"; do
            if [[ -e "$path" ]]; then
              echo "Forbidden Vercel hosting artifact reintroduced: $path" >&2
              exit 1
            fi
          done

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run package tests
        run: pnpm -r --if-present test

      - name: Typecheck and build
        run: pnpm build
