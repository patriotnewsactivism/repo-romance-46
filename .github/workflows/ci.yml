name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce production hosting policy
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "vercel.json"
            "Dockerfile.apiserver"
            "artifacts/api-server/src/railway-worker.ts"
          )
          for path in "${required[@]}"; do
            if [[ ! -e "$path" ]]; then
              echo "Required Vercel/Railway production artifact is missing: $path" >&2
              exit 1
            fi
          done

          retired=(
            ".github/workflows/deploy-cloud-run.yml"
            ".github/workflows/repair-canonical-domain.yml"
          )
          for path in "${retired[@]}"; do
            if [[ -e "$path" ]]; then
              echo "Retired automatic Cloud Run workflow reintroduced: $path" >&2
              exit 1
            fi
          done

      - name: Enforce canonical documentation topology
        run: node scripts/check-docs-consistency.mjs

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run package tests
        run: pnpm -r --if-present test

      - name: Typecheck and build
        run: pnpm build
