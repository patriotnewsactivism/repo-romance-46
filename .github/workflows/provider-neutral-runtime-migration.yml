name: Provider-neutral runtime migration

on:
  push:
    branches:
      - chore/provider-neutral-background-runtime

permissions:
  contents: write

concurrency:
  group: provider-neutral-runtime-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/provider-neutral-background-runtime
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Apply provider-neutral background runtime migration
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const helper = `import { logger } from "./logger";\n\nconst activeTasks = new Set<Promise<unknown>>();\n\nexport function runInBackground(job: Promise<unknown>, label = "background-task"): void {\n  let tracked: Promise<unknown>;\n  tracked = Promise.resolve(job)\n    .catch((error) => {\n      logger.error({ err: error, label }, "Background task failed");\n    })\n    .finally(() => {\n      activeTasks.delete(tracked);\n    });\n  activeTasks.add(tracked);\n}\n\nexport function backgroundTaskCount(): number {\n  return activeTasks.size;\n}\n\nexport async function drainBackgroundTasks(timeoutMs = 10_000): Promise<void> {\n  if (activeTasks.size === 0) return;\n  const snapshot = [...activeTasks];\n  let timeout;\n  const timer = new Promise((resolve) => {\n    timeout = setTimeout(resolve, timeoutMs);\n    timeout.unref?.();\n  });\n  await Promise.race([Promise.allSettled(snapshot), timer]);\n  if (timeout) clearTimeout(timeout);\n}\n`;
          fs.writeFileSync('artifacts/api-server/src/lib/background-tasks.ts', helper);

          const files = {
            'artifacts/api-server/src/app.ts': './lib/background-tasks',
            'artifacts/api-server/src/lib/ci-repair.ts': './background-tasks',
            'artifacts/api-server/src/routes/observability.ts': '../lib/background-tasks',
            'artifacts/api-server/src/routes/agentic-finisher.ts': '../lib/background-tasks',
            'artifacts/api-server/src/routes/analysis.ts': '../lib/background-tasks',
            'artifacts/api-server/src/routes/tiered-intelligence.ts': '../lib/background-tasks',
            'artifacts/api-server/src/routes/portfolio-finisher.ts': '../lib/background-tasks',
          };

          for (const [file, helperImport] of Object.entries(files)) {
            let text = fs.readFileSync(file, 'utf8');
            text = text.replace(/import \{ waitUntil \} from "@vercel\/functions";\n?/g, `import { runInBackground } from "${helperImport}";\n`);
            text = text.replace(/\bwaitUntil\(/g, 'runInBackground(');
            text = text.replace(/if \(process\.env\["VERCEL"\]\) runInBackground\(flushSentry\(\)\);/g, 'runInBackground(flushSentry(), "sentry-flush");');
            text = text.replace(/if \(process\.env\.VERCEL\) \{\s*runInBackground\(job\);\s*\} else \{\s*void job;\s*\}/g, 'runInBackground(job, "analysis-job");');
            fs.writeFileSync(file, text);
          }

          const indexPath = 'artifacts/api-server/src/index.ts';
          fs.writeFileSync(indexPath, `import "./instrument";\nimport app from "./app";\nimport { logger } from "./lib/logger";\nimport { backgroundTaskCount, drainBackgroundTasks } from "./lib/background-tasks";\n\nconst rawPort = process.env["PORT"];\nif (!rawPort) throw new Error("PORT environment variable is required but was not provided.");\nconst port = Number(rawPort);\nif (Number.isNaN(port) || port <= 0) throw new Error(\`Invalid PORT value: "\${rawPort}"\`);\n\nconst server = app.listen(port, (err) => {\n  if (err) {\n    logger.error({ err }, "Error listening on port");\n    process.exit(1);\n  }\n  logger.info({ port }, "Server listening");\n});\n\nlet shuttingDown = false;\nasync function shutdown(signal: string) {\n  if (shuttingDown) return;\n  shuttingDown = true;\n  logger.info({ signal, activeBackgroundTasks: backgroundTaskCount() }, "Graceful shutdown started");\n  const hardStop = setTimeout(() => {\n    logger.error({ signal, activeBackgroundTasks: backgroundTaskCount() }, "Graceful shutdown timed out");\n    process.exit(1);\n  }, 15_000);\n  hardStop.unref();\n  server.close(async () => {\n    await drainBackgroundTasks(10_000);\n    clearTimeout(hardStop);\n    logger.info({ signal }, "Graceful shutdown complete");\n    process.exit(0);\n  });\n}\nprocess.on("SIGTERM", () => void shutdown("SIGTERM"));\nprocess.on("SIGINT", () => void shutdown("SIGINT"));\n`);

          const pkgPath = 'artifacts/api-server/package.json';
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          delete pkg.dependencies['@vercel/functions'];
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
          NODE

          rm .github/workflows/provider-neutral-runtime-migration.yml

      - name: Refresh lockfile and install
        run: pnpm install --no-frozen-lockfile

      - name: Verify migration
        run: |
          set -euo pipefail
          if grep -R '@vercel/functions' artifacts/api-server/src artifacts/api-server/package.json pnpm-lock.yaml; then
            echo 'Residual @vercel/functions reference remains' >&2
            exit 1
          fi
          pnpm -r --if-present test
          pnpm build

      - name: Commit verified migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: replace Vercel waitUntil with persistent runtime tasks'
          git push origin HEAD:chore/provider-neutral-background-runtime
