name: Apply completion-first analysis fixes

on:
  push:
    branches:
      - fix/analysis-lifecycle-completion-first-ui
    paths:
      - .github/workflows/apply-completion-first-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/analysis-lifecycle-completion-first-ui
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Apply targeted source patches
        env:
          PATCH_ZLIB_B64: ""
        run: |
          python3 -c 'import os,base64,zlib; open("/tmp/patch.py","wb").write(zlib.decompress(base64.b64decode(os.environ["PATCH_ZLIB_B64"])))'
          python3 /tmp/patch.py

      - name: Add Vercel function lifecycle dependency
        run: pnpm add @vercel/functions --filter @workspace/api-server

      - name: Remove one-shot patch workflow
        run: rm .github/workflows/apply-completion-first-fix.yml

      - name: Commit patches
        shell: bash
        run: |
          git config user.name "repo-finisher-maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: make analysis durable and completion-first"
          git push origin HEAD:fix/analysis-lifecycle-completion-first-ui
