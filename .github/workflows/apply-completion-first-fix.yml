name: Apply completion-first analysis fixes

on:
  push:
    branches:
      - fix/analysis-lifecycle-completion-first-ui
    paths:
      - .github/workflows/apply-completion-first-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/analysis-lifecycle-completion-first-ui
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Apply targeted source patches
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          analysis = Path('artifacts/api-server/src/routes/analysis.ts')
          s = analysis.read_text()

          def rep(old, new, count=None):
              global s
              actual = s.count(old)
              if actual == 0:
                  raise SystemExit(f'Expected patch text not found: {old[:120]!r}')
              if count is not None and actual != count:
                  raise SystemExit(f'Expected {count} occurrence(s), found {actual}: {old[:120]!r}')
              s = s.replace(old, new)

          rep('import { decryptSecret } from "../lib/secrets";\n', 'import { waitUntil } from "@vercel/functions";\n', 1)

          # Gemini 3.7 Flash is the single Google production model across tiers.
          rep('    google: "gemini-2.5-flash",', '    google: "gemini-3.7-flash",', 1)
          rep('  const base = DEFAULT[provider] ?? "gpt-4o";', '  const base = DEFAULT[provider] ?? "gemini-3.7-flash";', 1)
          rep('        return { profilerModel: "gemini-2.5-pro", critiqueModel: "gemini-2.5-pro", synthesisModel: "gemini-2.5-pro", useThinking: false, thinkingBudget: 0 };', '        return { profilerModel: "gemini-3.7-flash", critiqueModel: "gemini-3.7-flash", synthesisModel: "gemini-3.7-flash", useThinking: false, thinkingBudget: 0 };', 1)
          rep('      return { profilerModel: "gemini-2.5-flash", critiqueModel: "gemini-2.5-flash", synthesisModel: "gemini-2.5-pro", useThinking: false, thinkingBudget: 0 };', '      return { profilerModel: "gemini-3.7-flash", critiqueModel: "gemini-3.7-flash", synthesisModel: "gemini-3.7-flash", useThinking: false, thinkingBudget: 0 };', 1)

          # Replace the generic opportunity prompt with completion-first policy.
          fallback = '''const FALLBACK_SYSTEM_PROMPT = `You are RepoFinisher's senior product architect. Your primary mission is to map each viable repository to production-ready completion.

DEFAULT DECISION: FINISH THE REPOSITORY INDEPENDENTLY.
- At least 95% of primary recommendations should be FINISH recommendations.
- Give each viable repo its own completion path rather than collapsing multiple repos into one idea.
- COMBINE or REPURPOSE is exceptional. Use it only when concrete code-level evidence shows that finishing the repo independently is clearly inferior, duplicative, or technically nonsensical. Never invent a combination just to create variety.
- A dormant repo is not automatically a combine/repurpose candidate; first determine how to finish it.

For every FINISH recommendation, build a real path to completion, not a generic checklist. Inspect the supplied evidence and identify the intended product, current completion blockers, missing core functionality, broken/stubbed flows, backend/data/auth/security gaps, UX gaps, testing/build issues, deployment readiness, observability, documentation, and rollback/operations needs that actually apply.

Before producing the final recommendation, internally draft the completion plan, challenge its assumptions, look for omissions and failure modes, then revise it. Do not expose private chain-of-thought. Return only the improved conclusion, concrete evidence, and executable completion steps.

Every next_steps array must function as an implementation-quality completion directive: reference actual files/features/APIs where evidence exists; order work by dependency; include acceptance criteria; require build/typecheck/lint/tests as appropriate; require deployment and smoke verification when the repo is deployable; and never call a repo complete while known blockers remain.

For every recommendation return:
- kind, title, repos, pitch
- effort (1-5), market_potential (1-5)
- next_steps: concrete completion sequence with acceptance criteria
- tech_stack
- marketing_tweet / marketing_linkedin only when useful
- estimated_hours

Also produce summary_md describing portfolio-level completion priorities.

Preserve coverage: return one primary recommendation for every viable repo represented by the detailed digests, up to 40 per synthesis. Prefer FINISH and independent completion. Generic advice is not acceptable.`;

const AI_JSON_SCHEMA'''
          s, n = re.subn(r'const FALLBACK_SYSTEM_PROMPT = `.*?`;\n\nconst AI_JSON_SCHEMA', fallback, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Fallback prompt patch failed: {n}')

          # Make the profiler generate a completion-first custom system prompt.
          rep(
              'custom_system_prompt (string): A specialized, domain-aware system prompt (200-350 words) for the main portfolio analysis AI. Replace generic advice with domain-specific direction. Examples of what to include:',
              'custom_system_prompt (string): A specialized, domain-aware system prompt (200-350 words) for the main portfolio analysis AI. It MUST be completion-first: require independent FINISH recommendations for at least 95% of viable repos and allow COMBINE/REPURPOSE only as rare, evidence-backed exceptions. Replace generic advice with domain-specific completion direction. Examples of what to include:',
              1,
          )
          rep(
              '  - For web devs: "Look for SaaS-worthy patterns — auth, billing, multi-tenancy. Flag repos with partial backend infrastructure as high-value COMBINE candidates."',
              '  - For web devs: "Look for SaaS-worthy patterns — auth, billing, multi-tenancy. Finish each app independently by identifying its exact missing production capabilities; do not combine repos merely because their stacks are compatible."',
              1,
          )
          rep(
              '  Tailor the FINISH/COMBINE/REPURPOSE instructions to what makes sense for this developer\'s stack.',
              '  Tailor the completion rubric to the developer\'s stack. Treat COMBINE/REPURPOSE as exceptional alternatives that require strong code-level evidence.',
              1,
          )
          rep(
              '        `Consider these for COMBINE or REPURPOSE recommendations if they overlap with the detailed repos above.`,',
              '        `Map these to independent FINISH paths where the metadata supports it. Do not invent COMBINE or REPURPOSE ideas from metadata alone.`,',
              1,
          )

          # Cross-batch pass now fills completion coverage instead of inventing merges.
          old_cross = '''Now find 1-5 ADDITIONAL "combine" recommendations that merge repos which were NOT already paired together.
Look for synergies across different repos — e.g., a frontend repo + a backend repo = full-stack product.
Also look for "repurpose" opportunities that weren't caught.

Return JSON with the same schema as before (summary_md + recommendations array).
Only include NEW recommendations not already in the list above. If no new opportunities exist, return an empty recommendations array.'''
          new_cross = '''Now perform a COMPLETION COVERAGE pass. Find viable repos in the index that do not yet have their own primary FINISH recommendation and add up to 10 missing FINISH recommendations.
Do not generate COMBINE or REPURPOSE recommendations in this pass. Do not merge repos merely because they share a stack.
Each added recommendation must map that repository's path to production-ready completion using the evidence available.

Return JSON with the same schema as before (summary_md + recommendations array).
Only include NEW FINISH recommendations that improve repo coverage. If completion coverage is already adequate, return an empty recommendations array.'''
          rep(old_cross, new_cross, 1)
          rep('// Cross-batch discovery for portfolios spanning multiple batches', '// Cross-batch completion-coverage pass for portfolios spanning multiple batches', 1)
          rep('      await reportProgress("Discovering cross-batch opportunities…");', '      await reportProgress("Checking cross-batch completion coverage…");', 1)

          # Critique and synthesis must challenge completion quality, not reward novelty/merging.
          rep('.slice(0, 12)', '.slice(0, 40)', 1)
          rep(
              '- missed_synergies (string[]): Repo combinations that weren\'t considered. Look for backend+frontend pairs, library+demo pairs, similar-domain repos that would be stronger together.',
              '- missed_synergies (string[]): Exceptional alternatives only. Return at most one evidence-backed combine/repurpose case if independent completion is clearly inferior; otherwise return an empty array.',
              1,
          )
          rep('.slice(0, 15)', '.slice(0, 50)', 1)
          rep(
              '2. Add missed synergies and gap opportunities the critique identified.\n3. Sharpen pitches to name a specific target user and value prop.\n4. Produce a fresh summary_md (200 words) that reflects this specific developer\'s portfolio, not a generic template.\n5. Return 5-12 final recommendations ranked by (market_potential * 2 - effort).',
              '2. Preserve a separate FINISH path for each viable repo represented in the draft. Do not collapse independent repos into a combined recommendation.\n3. Treat critique.missed_synergies as advisory only: use a COMBINE/REPURPOSE result only when the evidence is compelling, and keep at least 95% of final recommendations as FINISH.\n4. Sharpen pitches to name a specific target user and value prop, and make next_steps an executable completion directive with acceptance criteria.\n5. Produce a fresh summary_md (200 words) that reflects this specific developer\'s portfolio, not a generic template.\n6. Preserve completion coverage for up to 40 viable repos and rank within that set by (market_potential * 2 - effort).',
              1,
          )

          # Do not retry authentication/configuration failures.
          marker = 'async function callBatchedAIWithRetry(\n'
          if marker not in s:
              raise SystemExit('Retry function marker missing')
          helper = '''function isNonRetryableAIError(error: unknown): boolean {
  const message = error instanceof Error ? error.message : String(error);
  return /API_KEY_INVALID|api key not valid|invalid api key|no api key|401|403|unauthorized|forbidden/i.test(message);
}

'''
          s = s.replace(marker, helper + marker, 1)
          rep(
              '    } catch (e) {\n      lastErr = e;\n      if (attempt < maxAttempts) await sleep(2000 * attempt);\n    }',
              '    } catch (e) {\n      lastErr = e;\n      if (isNonRetryableAIError(e)) throw e;\n      if (attempt < maxAttempts) await sleep(2000 * attempt);\n    }',
              1,
          )

          # Accurate provider/model metadata.
          old_create = '''async function createAnalysisRow(ctx: AnalysisContext): Promise<string> {
  const { supabase, userId, prefs, triggerType } = ctx;
  const { data: analysis, error: aErr } = await supabase
    .from("analyses")
    .insert({
      user_id: userId,
      status: "running",
      trigger_type: triggerType,
      ai_provider: prefs?.custom_ai_provider || "openai",
      ai_model: prefs?.custom_ai_provider === "github_models" ? "gpt-4o-mini" : "gpt-4o",
    })'''
          new_create = '''async function createAnalysisRow(ctx: AnalysisContext): Promise<string> {
  const { supabase, userId, prefs, triggerType } = ctx;
  const provider = prefs?.custom_ai_provider || "google";
  const tier = prefs?.analysis_tier || "balanced";
  const models = getStageModels(provider, tier);
  const { data: analysis, error: aErr } = await supabase
    .from("analyses")
    .insert({
      user_id: userId,
      status: "running",
      trigger_type: triggerType,
      ai_provider: provider,
      ai_model: models.synthesisModel,
    })'''
          rep(old_create, new_create, 1)

          # Use central credential resolution and preflight AI before expensive repo digestion.
          old_provider = '''    const provider = prefs?.custom_ai_provider || "openai";
    let aiKey = prefs?.custom_ai_key || null;
    if (provider === "github_models" && !aiKey) aiKey = token;
    const aiConfig = { provider, apiKey: aiKey };
    const stageModels = getStageModels(provider, tier);

    // ── Step 2: Profile portfolio'''
          new_provider = '''    const provider = prefs?.custom_ai_provider || "google";
    const aiKey = prefs?.custom_ai_key || null;
    const aiConfig = { provider, apiKey: aiKey };
    const stageModels = getStageModels(provider, tier);

    if (!aiKey) {
      throw new Error(`AI provider "${provider}" has no configured API key. Configure a valid server-side or BYOK credential before running analysis.`);
    }

    await reportProgress(`Validating ${provider} / ${stageModels.profilerModel}…`);
    await withTimeout(
      callAI(
        {
          messages: [
            { role: "system", content: "Reply with exactly: ready" },
            { role: "user", content: "AI provider preflight." },
          ],
          model: stageModels.profilerModel,
        },
        aiConfig,
      ),
      15000,
      "AI provider preflight",
    );

    // ── Step 2: Profile portfolio'''
          rep(old_provider, new_provider, 1)

          # Explicit heartbeat and terminal timestamps.
          rep(
              '    await supabase.from("analyses").update({ error: msg }).eq("id", analysisId);',
              '    await supabase.from("analyses").update({ error: msg, updated_at: new Date().toISOString() }).eq("id", analysisId);',
              1,
          )
          rep(
              '    await supabase.from("analyses").update({ status: "failed", error: msg }).eq("id", analysisId);',
              '    await supabase.from("analyses").update({ status: "failed", error: msg, completed_at: new Date().toISOString(), updated_at: new Date().toISOString() }).eq("id", analysisId);',
              1,
          )

          # Vercel must keep the invocation alive after sending the run id.
          old_start = '''function startAnalysisJob(ctx: AnalysisContext, analysisId: string): void {
  runAnalysisJob(ctx, analysisId).catch((e) => {
    console.error(`[analysis ${analysisId}] unexpected background error:`, e);
  });
}'''
          new_start = '''function startAnalysisJob(ctx: AnalysisContext, analysisId: string): void {
  const job = runAnalysisJob(ctx, analysisId).catch(async (e) => {
    console.error(`[analysis ${analysisId}] unexpected background error:`, e);
    const msg = e instanceof Error ? e.message : "Analysis worker stopped unexpectedly";
    await ctx.supabase
      .from("analyses")
      .update({ status: "failed", error: msg, completed_at: new Date().toISOString(), updated_at: new Date().toISOString() })
      .eq("id", analysisId);
  });

  if (process.env.VERCEL) {
    waitUntil(job);
  } else {
    void job;
  }
}'''
          rep(old_start, new_start, 1)

          # Central resolver supplies provider + BYOK/platform fallback; no direct decrypting here.
          old_ctx = '''  const noopProgress: ProgressFn = async () => {};

  return {
    supabase,
    userId,
    token: credential.token,
    // `custom_ai_key` is sealed at rest; unseal it once here so every consumer
    // of this context works with a usable key rather than ciphertext.
    prefs: prefs ? ({ ...prefs, custom_ai_key: decryptSecret((prefs as { custom_ai_key: string | null }).custom_ai_key) } as AnalysisContext["prefs"]) : null,
    triggerType,
    onProgress: noopProgress,
  };'''
          new_ctx = '''  const noopProgress: ProgressFn = async () => {};
  const aiCredential = await loadAiCredential(supabase, userId, credential.token);
  const normalizedPrefs: AnalysisContext["prefs"] = {
    custom_ai_provider: aiCredential.provider,
    custom_ai_key: aiCredential.apiKey,
    filter_max_repos: prefs?.filter_max_repos ?? 200,
    filter_languages: prefs?.filter_languages ?? null,
    filter_min_stars: prefs?.filter_min_stars ?? 0,
    filter_exclude_archived: prefs?.filter_exclude_archived ?? true,
    analysis_tier: prefs?.analysis_tier ?? "balanced",
  };

  return {
    supabase,
    userId,
    token: credential.token,
    prefs: normalizedPrefs,
    triggerType,
    onProgress: noopProgress,
  };'''
          rep(old_ctx, new_ctx, 1)

          # Detail GET is also a stale-run watchdog.
          stale_anchor = '    if (!analysis) throw Object.assign(new Error("Analysis not found"), { status: 404 });\n\n    const { data: items } = await req.supabase!'
          stale_new = '''    if (!analysis) throw Object.assign(new Error("Analysis not found"), { status: 404 });

    if (
      analysis.status === "running" &&
      analysis.updated_at &&
      Date.now() - new Date(analysis.updated_at as string).getTime() > 10 * 60 * 1000
    ) {
      const staleMessage = "Analysis worker stopped reporting progress for more than 10 minutes. Rerun the analysis.";
      const now = new Date().toISOString();
      await req.supabase!
        .from("analyses")
        .update({ status: "failed", error: staleMessage, completed_at: now, updated_at: now })
        .eq("id", id)
        .eq("user_id", req.userId!);
      analysis.status = "failed";
      analysis.error = staleMessage;
      analysis.completed_at = now;
      analysis.updated_at = now;
    }

    const { data: items } = await req.supabase!'''
          rep(stale_anchor, stale_new, 1)

          analysis.write_text(s)

          # Slow status polling to a sensible cadence; GETs are still globally rate-limited.
          detail = Path('artifacts/repo-finisher/src/pages/analysis-detail.tsx')
          d = detail.read_text()
          if '}, 3000);' not in d:
              raise SystemExit('analysis-detail poll interval not found')
          d = d.replace('}, 3000);', '}, 10000);', 1)
          detail.write_text(d)

          # Make dashboard language reflect the actual product mission.
          dash = Path('artifacts/repo-finisher/src/pages/dashboard.tsx')
          ds = dash.read_text()
          old = 'AI will analyze your entire portfolio to find product opportunities'
          new = 'AI maps each viable repo to a production-ready completion path, then critiques and refines the plan before execution'
          if old not in ds:
              raise SystemExit('Dashboard description text not found')
          dash.write_text(ds.replace(old, new, 1))

          # RepoFinisher implementation prompt must aim at completion and self-review before output.
          rf = Path('artifacts/api-server/src/routes/repo-finisher.ts')
          rs = rf.read_text()
          new_system = '''  const system = `You are RepoFinisher's senior implementation planner. Your objective is to take this repository to production-ready completion within the approved scope — not merely make it "closer to shippable".

Before returning the plan, internally perform a draft-and-challenge loop:
1. Infer the intended product from the repository evidence and recommended completion steps.
2. Draft the smallest coherent implementation that closes the identified blockers.
3. Adversarially review that draft for missed core functionality, broken/stubbed flows, dependency/configuration issues, data/auth/security gaps, UX/accessibility issues, tests, build/typecheck/lint, deployment, observability, documentation, and rollback needs that actually apply.
4. Revise the draft so every change has a clear acceptance criterion and the plan does not claim completion while known blockers remain.
Do not expose private chain-of-thought; return only the concise improved analysis and exact file changes.

Rules:
- Preserve working architecture unless evidence shows it is the blocker.
- Fix actual missing core features and obvious bugs before cosmetic improvements.
- Create or fix README.md with installation, usage, configuration, deployment, and operational notes when needed.
- Add a LICENSE only when explicitly recommended and none exists; never replace an existing license.
- Add unprivileged CI when missing and appropriate.
- Add or repair tests that verify the changed behavior.
- Never create or edit secrets, private keys, production .env files, or credential files.
- Never use pull_request_target, write-all workflow permissions, or repository secrets in generated CI.
- Do not rewrite entire files unnecessarily, but each returned modified/created file must contain its FULL final content.
- For deleted files set content to an empty string.
- Keep this atomic plan to ${MAX_CHANGES} files or fewer. If true completion requires more than this safety limit, make this the highest-leverage coherent completion milestone and state the remaining blockers clearly rather than pretending the repo is complete.

Return JSON with:
- analysis: concise evidence-based summary of the completion blockers, what this plan closes, and any blockers that must remain for a later milestone
- changes: array of { path, status, content, description }`;'''
          rs, n = re.subn(r'  const system = `You are an expert software engineer that finishes incomplete codebases\..*?  const user = `Repo:', new_system + '\n\n  const user = `Repo:', rs, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'RepoFinisher system prompt patch failed: {n}')
          rf.write_text(rs)

          # Give the single Vercel API function enough lifetime for waitUntil work.
          wrapper = Path('api/[...path].mjs')
          wrapper.write_text('// Vercel Function wrapper around the API bundle produced during `vercel build`.\nexport const config = { maxDuration: 500 };\nexport { default } from "../artifacts/api-server/dist/vercel-function/vercel.mjs";\n')
          PY

      - name: Add Vercel function lifecycle dependency
        run: pnpm add @vercel/functions --filter @workspace/api-server

      - name: Remove one-shot patch workflow
        run: rm .github/workflows/apply-completion-first-fix.yml

      - name: Commit patches
        shell: bash
        run: |
          git config user.name "repo-finisher-maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: make analysis durable and completion-first"
          git push origin HEAD:fix/analysis-lifecycle-completion-first-ui
