name: Iterative finisher engine migration

on:
  push:
    branches:
      - feat/iterative-finish-until-target-v2

permissions:
  contents: write

concurrency:
  group: iterative-finisher-engine-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/iterative-finish-until-target-v2
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Make reasoning and execution ref-aware
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          function replaceExact(text, from, to, label) {
            if (!text.includes(from)) throw new Error(`Missing expected source pattern: ${label}`);
            return text.replace(from, to);
          }

          // Reason against the exact continuation branch instead of silently
          // falling back to the repository default branch.
          const reasoningPath = 'artifacts/api-server/src/lib/reasoning-orchestrator.ts';
          let reasoning = fs.readFileSync(reasoningPath, 'utf8');
          reasoning = replaceExact(reasoning,
            '    defaultBranch: string;\n    headSha: string;',
            '    defaultBranch: string;\n    evidenceRef: string;\n    headSha: string;',
            'RepoEvidence evidenceRef');
          reasoning = replaceExact(reasoning,
            'async function collectRepoEvidence(token: string, repoName: string, requestedNextSteps: string[]): Promise<RepoEvidence> {',
            'async function collectRepoEvidence(token: string, repoName: string, requestedNextSteps: string[], ref?: string): Promise<RepoEvidence> {',
            'collectRepoEvidence signature');
          reasoning = replaceExact(reasoning,
            '  const defaultBranch = String(repo.default_branch || "main");\n  const branchResponse = await ghFetch(token, `/repos/${repoName}/branches/${encodeURIComponent(defaultBranch)}`);\n  if (!branchResponse.ok) throw new Error(`Unable to inspect ${repoName} default branch.`);',
            '  const defaultBranch = String(repo.default_branch || "main");\n  const evidenceRef = ref?.trim() || defaultBranch;\n  const branchResponse = await ghFetch(token, `/repos/${repoName}/branches/${encodeURIComponent(evidenceRef)}`);\n  if (!branchResponse.ok) throw new Error(`Unable to inspect ${repoName} ref ${evidenceRef}.`);',
            'evidence branch selection');
          reasoning = replaceExact(reasoning,
            '      defaultBranch,\n      headSha,',
            '      defaultBranch,\n      evidenceRef,\n      headSha,',
            'evidenceRef result');
          reasoning = replaceExact(reasoning,
            '    portfolioRunId?: string;\n    mode?: "plan" | "replan";',
            '    portfolioRunId?: string;\n    ref?: string;\n    mode?: "plan" | "replan";',
            'reason input ref');
          reasoning = replaceExact(reasoning,
            '      collectRepoEvidence(github.token, input.repo, requestedNextSteps),',
            '      collectRepoEvidence(github.token, input.repo, requestedNextSteps, input.ref),',
            'reason evidence ref');
          fs.writeFileSync(reasoningPath, reasoning);

          const enginePath = 'artifacts/api-server/src/lib/repo-finisher-engine.ts';
          let engine = fs.readFileSync(enginePath, 'utf8');
          engine = replaceExact(engine,
            '  defaultBranch: string;\n  baseSha: string;',
            '  defaultBranch: string;\n  sourceBranch?: string;\n  baseSha: string;',
            'prepared plan source branch');
          engine = replaceExact(engine,
            '  defaultBranch: string;\n  baseSha: string;\n  treeSha: string;',
            '  defaultBranch: string;\n  sourceBranch: string;\n  baseSha: string;\n  treeSha: string;',
            'repo context source branch');
          engine = replaceExact(engine,
            'async function loadRepoContext(supabase: SupabaseClient, userId: string, repoName: string): Promise<RepoContext> {',
            'async function loadRepoContext(supabase: SupabaseClient, userId: string, repoName: string, sourceBranch?: string): Promise<RepoContext> {',
            'loadRepoContext signature');
          engine = replaceExact(engine,
            '  const defaultBranch = String(repo.default_branch || "main");\n  const head = await getBranchHead(token, repoName, defaultBranch);',
            '  const defaultBranch = String(repo.default_branch || "main");\n  const resolvedSourceBranch = sourceBranch?.trim() || defaultBranch;\n  const head = await getBranchHead(token, repoName, resolvedSourceBranch);',
            'context source branch');
          engine = replaceExact(engine,
            '    defaultBranch,\n    baseSha: head.commitSha,',
            '    defaultBranch,\n    sourceBranch: resolvedSourceBranch,\n    baseSha: head.commitSha,',
            'context result source branch');
          engine = replaceExact(engine,
            '    mode?: "plan" | "replan";\n  },',
            '    mode?: "plan" | "replan";\n    baseBranch?: string;\n  },',
            'prepare input base branch');
          engine = replaceExact(engine,
            '        portfolioRunId: data.portfolioRunId,\n        mode: data.mode ?? "plan",',
            '        portfolioRunId: data.portfolioRunId,\n        ref: data.baseBranch,\n        mode: data.mode ?? "plan",',
            'prepare reasoning ref');
          engine = replaceExact(engine,
            '  const context = await loadRepoContext(supabase, userId, data.repo);',
            '  const context = await loadRepoContext(supabase, userId, data.repo, data.baseBranch);',
            'prepare branch context');
          engine = replaceExact(engine,
            '    defaultBranch: context.defaultBranch,\n    baseSha: context.baseSha,',
            '    defaultBranch: context.defaultBranch,\n    sourceBranch: data.baseBranch?.trim() || undefined,\n    baseSha: context.baseSha,',
            'plan source branch');
          engine = replaceExact(engine,
            '  const actualHash = hashPreparedPlan(plan);\n  if (actualHash !== expectedPlanHash) {\n    throw Object.assign(new Error("Stored completion plan no longer matches its approval hash."), { status: 409 });\n  }\n\n  const connection = requireGithubCredential(await loadGithubCredential(supabase, userId));',
            '  const actualHash = hashPreparedPlan(plan);\n  if (actualHash !== expectedPlanHash) {\n    throw Object.assign(new Error("Stored completion plan no longer matches its approval hash."), { status: 409 });\n  }\n  if (plan.sourceBranch) {\n    throw Object.assign(new Error("Continuation plans must be executed with executeContinuationPlan so the existing draft PR branch is preserved."), { status: 409 });\n  }\n\n  const connection = requireGithubCredential(await loadGithubCredential(supabase, userId));',
            'block continuation through first executor');

          const continuation = `\nasync function updateBranchAtCommit(token: string, repo: string, branch: string, sha: string) {\n  const res = await ghFetch(token, \`/repos/\${repo}/git/refs/heads/\${encodeURIComponent(branch)}\`, {\n    method: "PATCH",\n    headers: { "Content-Type": "application/json" },\n    body: JSON.stringify({ sha, force: false }),\n  });\n  if (!res.ok) throw new Error(\`Failed to advance continuation branch: \${res.status} \${(await res.text()).slice(0, 200)}\`);\n}\n\nexport async function executeContinuationPlan(\n  supabase: SupabaseClient,\n  userId: string,\n  plan: PreparedFinishPlan,\n  expectedPlanHash: string,\n  branchName: string,\n  prNumber: number,\n  prUrl: string,\n): Promise<FinishResult> {\n  validateRepoName(plan.repo);\n  const actualHash = hashPreparedPlan(plan);\n  if (actualHash !== expectedPlanHash) {\n    throw Object.assign(new Error("Stored continuation plan no longer matches its approval hash."), { status: 409 });\n  }\n  if (!plan.sourceBranch || plan.sourceBranch !== branchName) {\n    throw Object.assign(new Error("Continuation plan is not bound to the active RepoFinisher branch."), { status: 409 });\n  }\n  const connection = requireGithubCredential(await loadGithubCredential(supabase, userId));\n  const token = connection.token;\n  const current = await getBranchHead(token, plan.repo, branchName);\n  if (current.commitSha !== plan.baseSha) {\n    throw Object.assign(new Error(\`Continuation branch changed after planning. Approved base \${plan.baseSha.slice(0, 12)} is no longer current; re-plan from the new head.\`), { status: 409, code: "STALE_BASE" });\n  }\n  const tree = await getRepoTree(token, plan.repo, current.treeSha);\n  const changes = validatePlanChanges(plan.changes, tree);\n  const blobs = new Map<string, string>();\n  await Promise.all(changes.filter((change) => change.status !== "deleted").map(async (change) => {\n    const blob = await createBlob(token, plan.repo, change.content);\n    blobs.set(change.path, blob.sha);\n  }));\n  const treeEntries = changes.map((change) => ({\n    path: change.path,\n    mode: change.mode,\n    type: "blob" as const,\n    sha: change.status === "deleted" ? null : blobs.get(change.path) || null,\n  }));\n  if (treeEntries.some((entry) => entry.sha === null && changes.find((change) => change.path === entry.path)?.status !== "deleted")) {\n    throw new Error("Failed to create one or more continuation Git blobs; branch was not changed.");\n  }\n  const newTree = await createTree(token, plan.repo, current.treeSha, treeEntries);\n  const commit = await createCommit(token, plan.repo, \`repo-finisher: continue approved plan \${expectedPlanHash.slice(0, 12)}\`, newTree.sha, plan.baseSha);\n  await updateBranchAtCommit(token, plan.repo, branchName, commit.sha);\n  const changeLog = changes.map((change) => ({ file: change.path, status: change.status, description: change.description }));\n  return {\n    repo: plan.repo,\n    branch: branchName,\n    pr_url: prUrl,\n    pr_number: prNumber,\n    files_changed: changes.length,\n    additions: 0,\n    deletions: 0,\n    summary: plan.summary,\n    changes: changeLog,\n    base_sha: plan.baseSha,\n    head_sha: commit.sha,\n    plan_hash: expectedPlanHash,\n  };\n}\n`;
          const marker = '\nexport async function verifyCommitChecks(';
          if (!engine.includes(marker)) throw new Error('Missing verifyCommitChecks marker');
          engine = engine.replace(marker, continuation + marker);
          fs.writeFileSync(enginePath, engine);
          NODE

          rm .github/workflows/iterative-engine-migration.yml

      - name: Install and verify
        run: |
          pnpm install --frozen-lockfile
          pnpm -r --if-present test
          pnpm build

      - name: Commit verified ref-aware engine
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: make reasoning and finisher continuation ref-aware'
          git push origin HEAD:feat/iterative-finish-until-target-v2
